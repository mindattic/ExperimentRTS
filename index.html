<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desert Planet</title>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <button id="menuButton" class="icon-button" type="button" aria-label="Menu">&#9776;</button>
    <div id="menuDropdown" class="menu-dropdown" hidden>
      <button id="reorientMenuItem" type="button">Reorient camera</button>
      <button id="freeCamMenuItem" type="button">Toggle free cam</button>
      <button id="settingsMenuItem" type="button">Settings&hellip;</button>
    </div>

    <div id="settingsModal" class="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <span>Settings</span>
          <button id="settingsCloseButton" class="icon-button" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">Graphics</div>
          <label class="modal-row">
            <span>Terrain quality</span>
            <select id="terrainQualitySelect"></select>
          </label>
          <div class="modal-hint">Applies to newly-visited planets (or after reload) - it doesn't re-mesh the planet you're currently on.</div>
          <label class="modal-row">
            <span>Night brightness</span>
            <input id="nightBrightnessSlider" type="range" min="0" max="100" step="1" />
          </label>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">Controls</div>
          <div id="keybindList" class="keybind-list"></div>
          <button id="resetBindingsButton" class="text-button" type="button">Reset to defaults</button>
          <label class="modal-row">
            <span>Invert selection-area resize (up/right shrinks instead of grows)</span>
            <input id="invertSelectionAreaCheckbox" type="checkbox" />
          </label>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">Developer</div>
          <label class="modal-row">
            <span>Developer mode (stats overlay)</span>
            <input id="developerModeCheckbox" type="checkbox" />
          </label>
        </div>
      </div>
    </div>

    <div id="focusList" class="focus-list" hidden>
      <div class="focus-list-title">Focus</div>
      <ol id="focusListItems"></ol>
    </div>
    <div id="reticle" class="reticle" hidden>
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <div id="reticleLabel" class="reticle-label"></div>
    </div>
    <div id="freeCamReticle" class="free-cam-reticle" hidden>
      <span class="crosshair-line horizontal"></span>
      <span class="crosshair-line vertical"></span>
    </div>
    <div id="freeCamBadge" class="free-cam-badge" hidden>FREE CAM</div>
    <div id="planeLockBadge" class="plane-lock-badge" hidden>PLANE LOCKED</div>
    <div id="cursorModeBadge" class="cursor-mode-badge" hidden>CURSOR MODE</div>
    <div id="orbitFocusLabel" class="orbit-focus-label" hidden></div>
    <div id="devStats" class="dev-stats" hidden></div>
    <div id="examineLayer" class="examine-layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
